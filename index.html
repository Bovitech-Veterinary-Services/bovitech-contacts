<!doctype html>
<html lang="en-AU" style="background:#fff">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Bovitech Contacts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141414; --ink2:#4a4743; --ink3:#858079; --line:#e4e0d9; --bg:#f6f4f0; --card:#fff;
  --red:#d71f2b; --red-bg:#fdeaea; --red-ink:#a3121c; --yellow-bg:#fff3c4; --yellow-ink:#7a5a00;
  --green:#1f9d3a; --green-bg:#e3f5e6; --blue:#1d5fd1;
  --r:12px; --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --cond:"Barlow Condensed","Barlow",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:16px;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
a.btn{text-decoration:none;color:inherit;display:inline-block}
@media(max-width:480px){header.top h1{font-size:19px}#net:not(.off){display:none}}
.app{display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:minmax(0,1fr);height:100dvh}
header.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top))}
header.top h1{font-family:var(--cond);font-size:21px;letter-spacing:.3px;margin:0;flex:0 0 auto;display:flex;flex-direction:column;line-height:1.1;min-width:0;overflow:hidden;margin-right:auto}
header.top h1 .ttl{white-space:nowrap}
header.top h1 .hi{font-family:var(--font);font-size:13px;font-weight:500;letter-spacing:0;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top h1 .hi:empty{display:none}
header.top .pill{min-width:0;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;display:block}
header.top .hbtn{flex:0 0 auto}
@media(max-width:420px){header.top h1{font-size:18px}header.top{gap:7px;padding-left:10px;padding-right:10px}}
#splash{position:fixed;inset:0;z-index:200;background:#fff;color:#141414;transition:opacity .35s}
#splash img{position:absolute;left:50%;top:50%;width:192px;height:192px;transform:translate(-50%,-50%);object-fit:contain}
#splash .txt{position:absolute;left:16px;right:16px;top:calc(50% + 110px);text-align:center;animation:splashin .4s ease-out both}
#splash h1{font-family:var(--cond);font-size:28px;margin:0}
#splash .hi{font-size:20px;color:#555;min-height:26px;margin-top:4px}
@keyframes splashin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#splash.gone{opacity:0;pointer-events:none}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:#2c2b29;color:#ddd;white-space:nowrap}
.pill.off{background:#5a3b00;color:#ffd77a}
.pill.warn{background:var(--red);color:#fff}
.hbtn{border:1px solid #3a3936;background:#2c2b29;color:#fff;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:#3a3936}
.hbtn.update{background:var(--red);border-color:var(--red);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(215,31,43,.35)}}
@media(max-width:480px){.hbtn span{display:none}.hbtn{font-size:16px;padding:2px 9px}}
nav.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.06)}
main{padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:12px;font-weight:600;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--red)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:grid;place-items:center}
main{overflow:hidden;display:grid;grid-template-columns:1fr;min-height:0;grid-row:3}
nav.tabs{grid-row:2}
@media(min-width:900px){nav.tabs{grid-row:2;grid-column:1}main{grid-row:2;grid-column:2}}
.pane{overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
#detail{display:none;background:var(--bg)}
body.show-detail #list{display:none}
body.show-detail #detail{display:block}
@media(min-width:900px){
  .app{grid-template-rows:auto 1fr;grid-template-columns:200px 1fr}
  header.top{grid-column:1/3}
  nav.tabs{flex-direction:column;border-top:0;border-right:1px solid var(--line);justify-content:flex-start;padding:10px 8px;gap:2px}
  nav.tabs button{flex:0;flex-direction:row;justify-content:flex-start;gap:10px;padding:10px 12px;font-size:15px;border-radius:9px}
  nav.tabs button.on{background:var(--red-bg)}
  .badge{position:static;margin-left:auto}
  main{grid-template-columns:minmax(360px,440px) 1fr}
  #detail{display:block;border-left:1px solid var(--line)}
  body.show-detail #list{display:block}
  .back{display:none!important}
  main.single{grid-template-columns:1fr}
  main.single #detail{display:none}
}
.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 13px;border-radius:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{padding:5px 10px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.inc{background:var(--green-bg);border-color:var(--green);color:#0d5c20}
.chip.exc{background:var(--red-bg);border-color:var(--red);color:var(--red-ink);text-decoration:line-through}
.chip.quick{border-style:dashed}
.row2{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--ink3);padding-top:6px}
.row2 select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 6px;font-size:13.5px}
.row2{flex-wrap:wrap;row-gap:6px}.row2>label{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.row2>label input[type=checkbox]{margin:0;width:17px;height:17px}.row2>span:first-child{flex-basis:100%}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;gap:11px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--card);cursor:pointer}
.item:hover{background:#faf8f5}
.item.sel{background:#fff6f6;box-shadow:inset 3px 0 0 var(--red)}
.av{width:46px;height:46px;border-radius:50%;flex:none;background:#ddd;object-fit:cover}
.item .t{flex:1;min-width:0}
.item .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{color:#e0a100}
.wdot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}
.group-h{position:sticky;top:0;background:#efebe4;font-family:var(--cond);font-size:15px;letter-spacing:.4px;padding:4px 12px;color:var(--ink2);text-transform:uppercase}
.empty{padding:40px 20px;text-align:center;color:var(--ink3)}
.rb{display:inline-block;font-size:12px;font-weight:700;padding:1px 6px;border-radius:5px;margin-right:4px;color:#fff;vertical-align:1px}
.rb.aplus{background:linear-gradient(135deg,#1c6b2a,#4fd36a)}.rb.a{background:#2bc33a}.rb.b{background:#e8b100;color:#222}.rb.c{background:#d71f2b}
.d-wrap{max-width:820px;margin:0 auto;padding:12px 14px 60px}
.back{border:0;background:none;color:var(--red);font-weight:600;padding:6px 0;cursor:pointer;font-size:16px}
.hero{display:flex;gap:16px;align-items:center;margin:6px 0 14px}
.hero img{width:104px;height:104px;border-radius:50%;object-fit:cover;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.hero h2{font-family:var(--cond);font-size:28px;margin:0;line-height:1.05}
.hero .sub{color:var(--ink2);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.card h3{font-family:var(--cond);font-size:16px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card h3{flex-wrap:wrap}
.rich{line-height:1.45;overflow-wrap:anywhere}
.rich h3{font-family:var(--font);font-size:17px;text-transform:none;letter-spacing:0;color:var(--ink);margin:8px 0 2px}
.rich ul,.rich ol{margin:4px 0;padding-left:22px}
.rich mark{background:#fff3a0}
.richbar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.richedit{min-height:110px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
.richedit:focus{border-color:var(--ink)}
#list,#detail{overflow-x:hidden}
.card .list{margin:0 -14px -12px}
.d-wrap .actions label.row2{gap:6px}
.card.warn{background:var(--red-bg);border-color:#f3b3b6}
.card.warn h3,.card.warn .body{color:var(--red-ink)}
.card.side{background:#fff6c7;border-color:#efd46a}
.card.side h3,.card.side .body{color:#6b4f00}
.f textarea.sidenote{background:#fffbe3;border-color:#efd46a;color:#6b4f00}
#detail.dna{background:#f7c9cc}
#detail.dna .card{border-color:#e9a3a8}
.inactivebox{background:#111;color:#ff3b3b;font-weight:800;border-radius:12px;padding:10px 14px;margin:6px 0 12px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.inactivebox .body{color:#ff4d4d;font-weight:700}
.inactivebox .secedit{background:#2a2a2a;border-color:#444}
.dnareason{background:#fff;border:2px solid var(--red);border-radius:12px;padding:10px 14px;margin:-2px 0 12px;color:var(--red-ink)}
.checks label.rt{border-color:#b9d7bd;background:#f3f8f3}
.checks.big label{padding:8px 12px;font-size:15.5px}
.checks.big input{width:18px;height:18px}
.dnabanner{background:var(--red);color:#fff;font-family:var(--cond);font-size:22px;letter-spacing:.5px;text-align:center;padding:12px;border-radius:12px;margin:6px 0 10px;box-shadow:0 2px 8px rgba(215,31,43,.35)}
.body{white-space:pre-wrap;line-height:1.45}
.kv{display:flex;gap:10px;padding:6px 0;border-top:1px solid #f0ede8;align-items:baseline}
.kv:first-of-type{border-top:0}
.kv .k{width:96px;flex:none;color:var(--ink3);font-size:14px}
.kv .v{flex:1;min-width:0;overflow-wrap:anywhere}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 3px;font-size:14px;background:#fff}
.tag img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.tag.noimg{padding-left:10px}
.farm{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:#fff}
.farm.red{background:var(--red-bg);border-color:#f3b3b6;color:var(--red-ink)}
.farm .fn{font-weight:700}
.farm .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin-top:4px}
.verify{background:var(--yellow-bg);color:var(--yellow-ink);border-radius:6px;padding:1px 6px;font-weight:600;font-size:13px}
.flagline{display:flex;gap:8px;align-items:flex-start;background:#fff8e1;border:1px solid #f0d78a;border-radius:9px;padding:8px 10px;margin:6px 0;font-size:14px}
.biz-link{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #f0ede8;cursor:pointer}
.biz-link:first-of-type{border-top:0}
.bcrow{display:flex;flex-wrap:wrap;align-items:center;column-gap:10px;border-top:1px solid #f0ede8;padding:4px 0 8px}.bcrow:first-of-type{border-top:0}.bcrow>.biz-link{flex:1 1 240px;min-width:0;border-top:0}.bcrow>.biz-link>div:last-child{min-width:0;overflow-wrap:anywhere}.bcacts{display:flex;flex-wrap:wrap;gap:6px;flex:0 1 auto}html[data-theme=dark] .bcrow{border-color:var(--line)}
@media(max-width:600px){.bcacts .btn.small{padding:6px 9px;font-size:13.5px}.bcacts{gap:5px}}
/* forms */
.sheet-bg{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.sheet-bg{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94dvh;overflow:auto;border-radius:16px 16px 0 0;padding:0 0 20px}
@media(min-width:700px){.sheet{border-radius:16px}}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);z-index:2}
.sheet-h h2{font-family:var(--cond);font-size:22px;margin:0;flex:1}
.form{padding:12px 16px}
.f{margin-bottom:12px}
.f>label,.lbl{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.f input[type=text],.f input[type=number],.f input:not([type]),.f select,.f textarea,.rep input,.rep select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:16px}
.f textarea{min-height:90px;resize:vertical}
.f textarea.warn{background:#fff5f5;border-color:#f3b3b6;color:var(--red-ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media(max-width:520px){.grid2.stack{grid-template-columns:minmax(0,1fr)}}
.rep{display:flex;gap:6px;margin-bottom:6px}
.rep .x{border:0;background:none;color:var(--red);font-size:22px;padding:0 6px;cursor:pointer}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:14px;cursor:pointer}
.checks input{margin:0}
.verifybox{background:var(--yellow-bg);border:2px solid #e8c440;border-radius:10px;padding:10px 12px;margin:8px 0}
.verifybox b{color:var(--yellow-ink)}
.hint{font-size:13px;color:var(--ink3);margin-top:3px}
.results{border:1px solid var(--line);border-radius:9px;background:#fff;max-height:260px;overflow:auto;margin-top:4px}
.results div{padding:8px 10px;border-top:1px solid #f0ede8;cursor:pointer}
.results div:first-child{border-top:0}
.results div:hover{background:#faf8f5}
.stop{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.stop .num{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.stop .t{flex:1;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 12px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.job{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line);background:#fff}
.job .flag{color:var(--red);flex:none;margin-top:2px}
.job .t{flex:1;min-width:0}
.job .who{font-weight:600}
.job .note{font-size:14px;color:var(--ink2)}
.job .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.subchips{margin-top:8px;padding-left:12px;border-left:3px solid var(--line)}
.relsug{border-top:1px solid var(--line);padding:6px 0}.relsug:first-child{border-top:0}.relsug .acts{margin-top:4px}
details.jobgroup>summary{list-style:none;cursor:pointer;padding:10px 12px;background:#efebe4;font-weight:700;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
details.jobgroup>summary::-webkit-details-marker{display:none}
.jobcheck{width:20px;height:20px;flex:none;margin:2px 0 0;accent-color:var(--ink);cursor:pointer}
.job.jobsel{background:#fffbea}
.bulkbar{position:sticky;top:0;z-index:4;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:#fff3c4;border-bottom:1px solid #e8c440}
.bkop{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.bkop input{margin-top:3px;width:18px;height:18px;flex:none}
.bkop.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--red);background:#fffdf7}
.greenbtn{background:var(--green-bg)!important;border-color:var(--green)!important}
.count{background:var(--red);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px}
.pressed{animation:pressfx .45s ease-out}
@keyframes pressfx{0%{transform:scale(.94);filter:brightness(.85)}60%{transform:scale(1.02)}100%{transform:scale(1);filter:none}}
button:active,.btn:active,.hbtn:active{transform:scale(.95)}
.spinr{display:inline-block}
.spinr.go{animation:spinfx .8s ease-in-out}
@keyframes spinfx{to{transform:rotate(360deg)}}
.callout{position:fixed;z-index:120;max-width:290px;animation:calloutin .25s ease-out}
.callout-body{background:#fff8d6;color:var(--ink);border:2px solid #e2b100;border-radius:12px;padding:9px 12px;font-size:14.5px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.callout-arrow{position:absolute;top:-24px;font-size:20px;color:#e2b100;animation:bounceup 1s ease-in-out infinite}
@keyframes bounceup{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes calloutin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.callout{margin-top:22px}
/* dark mode (Settings → Display) */
html[data-theme=dark]{--ink:#ececea;--ink2:#cfcbc4;--ink3:#9b968e;--line:#3a3936;--bg:#151514;--card:#211f1e;--red-bg:#3b1517;--red-ink:#ff8d92;--yellow-bg:#3a3215;--yellow-ink:#f2d37b;--green-bg:#16311c;color-scheme:dark}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea,html[data-theme=dark] .rich{background:#1a1918;color:var(--ink);border-color:var(--line)}
html[data-theme=dark] .card[style*="background:#"],html[data-theme=dark] .body[style*="background:#fff"],html[data-theme=dark] .callout-body{background:#2a2725!important;color:var(--ink)}
html[data-theme=dark] .card.side,html[data-theme=dark] .card.side .body,html[data-theme=dark] .card.side h3{background:#33301a;color:#f2d37b}
html[data-theme=dark] .card.warn{background:#3b1517}
html[data-theme=dark] .item.sel,html[data-theme=dark] .jobsel{background:#2d2a27}
html[data-theme=dark] header.top{background:#0b0b0a;color:#fff}
html[data-theme=dark] .seg,html[data-theme=dark] .tag{background:var(--card)}
html[data-theme=dark] .group-h{background:#2a2826}
html[data-theme=dark] .btn,html[data-theme=dark] .seg button,html[data-theme=dark] .tag{color:var(--ink)}
html[data-theme=dark] header.top h1{color:#fff}
html[data-theme=dark] .toast{background:#3a3836;color:#fff}
html[data-theme=dark] .btn.primary,html[data-theme=dark] .seg button.on,html[data-theme=dark] .stop .num{background:#ececea;color:#151514;border-color:#ececea}
.setsec>summary{font-family:var(--cond);font-size:17px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink2);cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:2px 0}
.setsec>summary::-webkit-details-marker{display:none}
.setsec>summary::after{content:'▸';margin-left:auto;color:var(--ink3);transition:transform .15s}

<div id="splash"><img src="img/icon-512.png" alt="Bovitech Veterinary Services"><div class="txt"><h1>Bovitech Contacts App</h1><div class="hi" id="splash-hi"></div></div></div>
<script>(function(){var n='';try{n=localStorage.getItem('bvt-nick')||(localStorage.getItem('bvt-devname')||'').split(/\s+[\u2013-]\s+/)[0].replace(/'s (phone|pc|laptop|computer|tablet)$/i,'');}catch(e){}document.getElementById('splash-hi').textContent=n?'Hi '+n:'';var t0=Date.now(),done=false;window.hideSplash=function(){if(done)return;done=true;setTimeout(function(){var s=document.getElementById('splash');if(!s)return;s.classList.add('gone');setTimeout(function(){s.remove();},400);},Math.max(0,1200-(Date.now()-t0)));};setTimeout(window.hideSplash,5000);})();</script>
<script>(function(){function show(msg){if(window.APP_READY||document.getElementById('crashbox'))return;var d=document.createElement('div');d.id='crashbox';d.style.cssText='position:fixed;left:12px;right:12px;bottom:16px;z-index:300;background:#fff;border:2px solid #d71f2b;border-radius:12px;padding:12px 14px;font:15px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.25);color:#141414';d.innerHTML='<b>The app hit a problem while opening.</b><div style="font-size:13px;color:#666;margin:4px 0 8px;word-break:break-word">'+String(msg).replace(/</g,'&lt;').slice(0,300)+'</div><button onclick="location.reload()" style="padding:8px 12px;margin-right:6px">Try again</button><button onclick="(async function(){try{var r=await navigator.serviceWorker.getRegistrations();for(var i of r)await i.unregister();var k=await caches.keys();for(var j of k)await caches.delete(j);}catch(e){}location.reload();})()" style="padding:8px 12px">Reload the latest version</button><div style="font-size:12px;color:#666;margin-top:6px">Your contacts are safe — they stay on this device and in Google Drive.</div>';document.body.appendChild(d);var s=document.getElementById('splash');if(s)s.remove();}
window.addEventListener('error',function(e){show(e.message||e.error)});window.addEventListener('unhandledrejection',function(e){show((e.reason&&(e.reason.stack||e.reason.message))||e.reason)});setTimeout(function(){if(!window.APP_READY)show('Still loading after 20 seconds — check the internet connection, or tap "Reload the latest version".')},20000);})();</script>
